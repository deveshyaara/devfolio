  <rect x="340" y="604" width="760" height="118" fill="#0B0D14" stroke="#262A36"/>
  <text x="362" y="632" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">EVENT STREAM</text>
  <text x="362" y="658" font-family="ui-monospace, monospace" font-size="12" fill="#93C5FD">[DISPATCH] → ws://hub/room/main  { action: "PLAY_SYNC", target: ["android-tv", "webos"] }</text>
  <text x="362" y="680" font-family="ui-monospace, monospace" font-size="12" fill="#34D399">[ACK]      ← android-tv-01       { player: "ExoPlayer", status: "BUFFERING_COMPLETE" }</text>
  <text x="362" y="702" font-family="ui-monospace, monospace" font-size="12" fill="#34D399">[ACK]      ← lg-webos-oled       { service: "luna://media", status: "PLAYING" }</text>
